<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Useful Information Car - 요청사항 게시판</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="antialiased text-gray-800">

    <div class="max-w-2xl mx-auto bg-white min-h-screen relative shadow-xl overflow-x-hidden flex flex-col">
        
        <header class="bg-white px-6 py-5 flex justify-between items-center sticky top-0 z-50 shadow-sm rounded-b-3xl mb-2 shrink-0">
            <div class="flex items-center gap-3 cursor-pointer" onclick="location.href='index.html'">
                <i class="fa-solid fa-arrow-left text-gray-600 text-lg"></i>
                <span class="font-bold text-lg text-emerald-600">요청사항 게시판</span>
            </div>
            <div class="w-10 h-10 bg-emerald-50 rounded-full flex items-center justify-center cursor-pointer hover:bg-emerald-100 transition shadow-sm text-emerald-600">
                <i class="fa-solid fa-pen-to-square"></i>
            </div>
        </header>

        <section class="px-5 py-6 shrink-0 bg-emerald-50 mb-4 mx-4 rounded-3xl mt-4 border border-emerald-100">
            <h1 class="text-xl font-bold mb-2 text-emerald-800 leading-snug">차량 정보가 부족한가요?</h1>
            <p class="text-[14px] text-emerald-600 mb-0">찾으시는 차량의 정보가 없다면 여기에 남겨주세요.<br>운영자가 확인 후 빠르게 업데이트하겠습니다!</p>
        </section>

        <section class="px-5 py-4 flex-1">
            <div class="flex justify-between items-center mb-4 px-1">
                <h2 class="font-bold text-gray-700">최근 요청 목록</h2>
                <span class="text-xs text-gray-400 font-medium">실시간 업데이트</span>
            </div>

            <div id="board-list" class="space-y-3">
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition cursor-pointer">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[10px] font-bold text-emerald-500 bg-emerald-50 px-2.5 py-1 rounded-md">업데이트 완료</span>
                        <span class="text-[11px] text-gray-400">2026.02.18</span>
                    </div>
                    <h3 class="font-bold text-[15px] text-gray-800 mb-1">제네시스 GV70 페이스리프트 정보 부탁드려요!</h3>
                    <p class="text-[13px] text-gray-500 line-clamp-1">새로 나온 모델이라 고질병 정보가 궁금합니다.</p>
                </div>

                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition cursor-pointer">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[10px] font-bold text-amber-500 bg-amber-50 px-2.5 py-1 rounded-md">검토 중</span>
                        <span class="text-[11px] text-gray-400">2026.02.19</span>
                    </div>
                    <h3 class="font-bold text-[15px] text-gray-800 mb-1">BMW i4 M50 모델 소모품 규격이 궁금합니다.</h3>
                    <p class="text-[13px] text-gray-500 line-clamp-1">전기차는 오일류 말고 어떤 걸 점검해야 할까요?</p>
                </div>

                <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition cursor-pointer text-center py-10 border-dashed border-2">
                    <i class="fa-solid fa-plus text-gray-300 text-3xl mb-3"></i>
                    <p class="text-gray-400 text-sm font-medium">더 많은 요청사항을 기다리고 있습니다.</p>
                </div>
            </div>
        </section>

        <div class="p-5 sticky bottom-0 bg-white border-t border-gray-100 rounded-t-3xl shadow-[0_-5px_20px_rgba(0,0,0,0.05)]">
            <button onclick="alert('문의하기 모달을 준비 중입니다.')" class="w-full bg-emerald-500 text-white font-bold py-4 rounded-2xl shadow-lg hover:bg-emerald-600 transition-all text-[16px]">
                새 요청글 작성하기
            </button>
        </div>
    </div>

</body>
</html>
